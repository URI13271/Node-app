<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#E0482B" />
  <title>관리자 - 마중길</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" />
  <!-- 3D 지도 라이브러리 (MapLibre GL JS 4.7.1, vendor/ 에 받아 둔 파일). js/map.js 에서 전역 maplibregl 로 쓴다 -->
  <link rel="stylesheet" href="/vendor/maplibre-gl-4.7.1/maplibre-gl.css" />
  <script src="/vendor/maplibre-gl-4.7.1/maplibre-gl.js"></script>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<!-- F-06 관리자 문장 작성, N-04 관리자 키. 호출 순서는 API 명세서 6장 (관리자 진입 → 편집 → 저장) -->
<body>
  <div class="app">
    <header class="topbar"><a class="btn btn-icon" href="/" aria-label="뒤로">←</a><b>관리자</b></header>
    <!-- 1) 키 입력 -->
    <form id="key-form" class="stack">
      <label class="label" for="admin-key">관리자 키</label>
      <input id="admin-key" class="input" type="password" autocomplete="off" />
      <button class="btn btn-primary">확인</button>
    </form>
    <!-- 2) 편집 (키 확인 뒤 hidden 을 지운다) -->
    <section id="editor" hidden>
      <select id="place-select" class="input"></select>
      <select id="route-select" class="input"></select>
      <div id="map" class="map map-preview"></div>
      <ol id="step-list" class="list"></ol>
      <button id="btn-save" class="btn btn-primary">저장</button>
    </section>
    <!-- 3) 409 충돌 비교 창 -->
    <div id="conflict-dialog" class="sheet" role="dialog" aria-modal="true" hidden></div>

    <!-- 뼈대 전용: 이 화면에서 만들 것. 구현하면 이 블록을 지운다 -->
    <section class="skeleton">
      <h2>만들 것</h2>
      <ul>
        <li>N-04 관리자 키 입력, 401, 잠금 429 처리</li>
        <li>장소, 경로 선택</li>
        <li>단계 편집 (문장, 랜드마크, 지점, 카메라)</li>
        <li>초안 검사 (js/draft-checks.js), 초안 임시 보관 (js/admin-store.js)</li>
        <li>저장: PUT 전체 교체, PATCH 단계 하나</li>
        <li>409 충돌 비교 화면 (최신으로 되돌리기, 내 수정으로 덮어쓰기)</li>
      </ul>
    </section>
    <nav class="skeleton-nav" aria-label="뼈대 화면 이동">
      <a class="btn btn-sm" href="/">홈</a>
      <a class="btn btn-sm" href="/place.html?id=1">장소 상세</a>
      <a class="btn btn-sm" href="/guide.html?id=1">3D 안내</a>
      <a class="btn btn-sm" href="/admin.html">관리자</a>
    </nav>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="/js/pages/admin.js"></script>
</body>
</html>
