<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#E0482B" />
  <title>장소 상세 - 마중길</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" />
  <!-- 3D 지도 라이브러리 (MapLibre GL JS 4.7.1, vendor/ 에 받아 둔 파일). js/map.js 에서 전역 maplibregl 로 쓴다 -->
  <link rel="stylesheet" href="/vendor/maplibre-gl-4.7.1/maplibre-gl.css" />
  <script src="/vendor/maplibre-gl-4.7.1/maplibre-gl.js"></script>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<!-- F-01 장소 상세 + F-03 강조 + F-04 내비 연결. GET /places/{id}, /buildings, /walk-routes. 주소 예: place.html?id=1 -->
<body>
  <div class="app">
    <header class="topbar"><a class="btn btn-icon" href="/" aria-label="뒤로">←</a></header>
    <div id="map" class="map map-preview"></div>
    <div id="map-legend" class="legend" aria-label="지도 범례"></div>
    <section id="place-info"></section>
    <ul id="parking-list" class="list"></ul>
    <!-- 도보 경로가 하나도 없을 때만 보인다. 3D 안내 버튼을 왜 못 누르는지 알려 준다 -->
    <p id="route-notice" class="notice" role="status" hidden>이 장소는 아직 도보 경로 안내가 준비되지 않았어요. 내비로 주차장까지는 갈 수 있어요.</p>
    <div class="actions">
      <button id="btn-navi" class="btn">내비로 주차장까지</button>
      <a id="btn-guide" class="btn btn-primary" href="#">3D 안내 시작</a>
    </div>
    <!-- F-04 내비 앱 선택 시트 (카카오, 네이버, 티맵). 열 때 hidden 을 지운다 -->
    <div id="navi-sheet" class="sheet" hidden></div>
    <!-- 내비 앱에서 돌아왔을 때 도착 판정. 위치를 못 받거나(unavailable) 멀면(far) "주차장에 도착했어요" 버튼으로 직접 진행 -->
    <div id="arrival-check" class="card" role="status" hidden></div>

    <footer class="site-footer"><a href="/about.html">서비스 정보, 출처</a></footer>

    <!-- 뼈대 전용: 이 화면에서 만들 것. 구현하면 이 블록을 지운다 -->
    <section class="skeleton">
      <h2>만들 것</h2>
      <ul>
        <li>장소 정보 (이름, 분류, 주소, 설명)</li>
        <li>F-03 목적 건물 강조 미리 보기 지도 (#map)</li>
        <li>주차장 목록과 주차장별 도보 경로 유무</li>
        <li>F-04 내비 연결 시트, 돌아오면 도착 판정</li>
        <li>3D 안내 시작 버튼 (경로 없으면 비활성)</li>
      </ul>
    </section>
    <nav class="skeleton-nav" aria-label="뼈대 화면 이동">
      <a class="btn btn-sm" href="/">홈</a>
      <a class="btn btn-sm" href="/place.html?id=1">장소 상세</a>
      <a class="btn btn-sm" href="/guide.html?id=1">3D 안내</a>
      <a class="btn btn-sm" href="/admin.html">관리자</a>
    </nav>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="/js/pages/place.js"></script>
</body>
</html>
