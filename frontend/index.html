<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#E0482B" />
  <title>마중길</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<!-- F-01 검색/홈. 입력 300ms 디바운스 후 GET /api/v1/places?q= (API 명세서 6장) -->
<body>
  <div class="app">
    <header class="topbar">
      <b>마중길</b>
      <a class="btn btn-sm" href="/admin.html">관리자</a>
    </header>
    <h1>목적지 근처에서 어디로 들어갈지 미리 봅니다</h1>
    <label class="search">
      <span aria-hidden="true">⌕</span>
      <input id="q" type="search" maxlength="50" placeholder="장소 이름으로 검색" aria-label="장소 검색" />
    </label>
    <p id="result-title" class="label" aria-live="polite">시연 장소</p>
    <ul id="place-list" class="list"></ul>

    <footer class="site-footer"><a href="/about.html">서비스 정보, 출처</a></footer>

    <!-- 뼈대 전용: 이 화면에서 만들 것. 구현하면 이 블록을 지운다 -->
    <section class="skeleton">
      <h2>만들 것</h2>
      <ul>
        <li>F-01 장소 검색 입력 (최대 50자, 300ms 디바운스)</li>
        <li>검색 결과 목록, 0건 안내 (낭독 aria-live)</li>
        <li>시연 장소 목록 (검색어 없을 때)</li>
        <li>항목을 누르면 place.html?id=장소id 로 이동</li>
      </ul>
    </section>
    <nav class="skeleton-nav" aria-label="뼈대 화면 이동">
      <a class="btn btn-sm" href="/">홈</a>
      <a class="btn btn-sm" href="/place.html?id=1">장소 상세</a>
      <a class="btn btn-sm" href="/guide.html?id=1">3D 안내</a>
      <a class="btn btn-sm" href="/admin.html">관리자</a>
    </nav>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="/js/pages/home.js"></script>
</body>
</html>
