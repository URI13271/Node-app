<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#E0482B" />
  <title>안내 문장 편집 - 마중길</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" />
  <link rel="stylesheet" href="/vendor/maplibre-gl-4.7.1/maplibre-gl.css" />
  <script src="/vendor/maplibre-gl-4.7.1/maplibre-gl.js"></script>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="app admin-app">
    <header class="topbar">
      <a class="btn btn-icon" href="/" aria-label="뒤로">←</a>
      <b>안내 문장 편집</b>
      <button id="btn-key-clear" class="btn btn-sm" type="button" hidden>키 지우기</button>
    </header>

    <form id="key-form" class="stack key-form">
      <label class="label" for="admin-key">관리자 키</label>
      <input id="admin-key" class="input" type="password" autocomplete="off" required />
      <button class="btn btn-primary" type="submit">확인</button>
      <p id="key-status" class="notice" role="status" hidden></p>
    </form>

    <section id="editor" class="admin-editor" hidden>
      <label class="label" for="updated-by">작성자</label>
      <input id="updated-by" class="input" type="text" maxlength="50" autocomplete="name" placeholder="이름을 입력하세요" />

      <label class="label" for="place-select">장소</label>
      <select id="place-select" class="input"></select>
      <label class="label" for="route-select">도보 경로</label>
      <select id="route-select" class="input"></select>
      <p id="route-meta" class="route-meta" aria-live="polite"></p>

      <div id="map" class="map map-preview"></div>
      <div id="map-legend" class="legend" aria-label="지도 범례"></div>
      <div id="draft-recovery" class="notice" role="status" hidden></div>
      <div id="editor-status" class="notice" role="status" hidden></div>
      <ol id="step-list" class="list step-list"></ol>

      <div class="actions admin-actions">
        <button id="btn-add-step" class="btn" type="button">단계 추가</button>
        <button id="btn-save" class="btn btn-primary" type="button">전체 저장 (PUT)</button>
      </div>
      <a id="btn-preview" class="btn preview-link" href="#" target="_blank" rel="noopener">여행객 화면에서 확인</a>
    </section>

    <div id="conflict-dialog" class="sheet" role="dialog" aria-modal="true" aria-labelledby="conflict-title" hidden></div>
    <div id="warning-dialog" class="sheet" role="dialog" aria-modal="true" aria-labelledby="warning-title" hidden></div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="/js/pages/admin.js"></script>
</body>
</html>
